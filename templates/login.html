<!DOCTYPE html>
<html lang="ur">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultyTime</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{

background:white;
width:380px;
padding:35px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.35);

}

h1{

text-align:center;
color:#1976D2;
margin-bottom:10px;

}

p{

text-align:center;
color:#666;
margin-bottom:30px;

}

input{

width:100%;
padding:14px;
margin-top:12px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#1976D2;
color:white;
font-size:17px;
cursor:pointer;

}

button:hover{

background:#0D47A1;

}

.links{

margin-top:20px;
text-align:center;

}

.links a{

text-decoration:none;
color:#1976D2;
margin:8px;

}

.footer{

margin-top:25px;
text-align:center;
color:#777;
font-size:14px;

}

</style>

</head>

<body>
<div class="logo-container">
    <img src="{{ url_for('static', filename='logo.png') }}"
         alt="MultyTime Logo"
         class="app-logo">
</div>
<div class="login-box">

<h1>MultyTime</h1>

<p>Welcome Back! Please Login</p>

<form action="/dashboard" method="GET">

<input type="email"
placeholder="Enter Email"
required>

<input type="password"
placeholder="Enter Password"
required>

<button type="submit">

Login

</button>

</form>

<div class="links">

<a href="#">Forgot Password?</a>

|

<a href="#">Create Account</a>

</div>

<div class="footer">

© 2026 MultyTime

</div>

</div>

</body>
</html>
