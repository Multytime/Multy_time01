<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | MultyTime</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1e293b);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:500px;
background:#fff;
border-radius:22px;
padding:28px;
box-shadow:0 15px 40px rgba(0,0,0,.25);

}

h1{

text-align:center;
color:#1976D2;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#666;
margin-bottom:30px;

}

.item{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px;

margin-bottom:16px;

background:#f5f7fb;

border-radius:14px;

transition:.3s;

}

.item:hover{

background:#eef4ff;

}

.label{

font-size:17px;
font-weight:bold;
color:#333;

}

.setting-link{

text-decoration:none;
color:#1976D2;
font-weight:bold;

}

.switch{

position:relative;
display:inline-block;
width:54px;
height:28px;

}

.switch input{

display:none;

}

.slider{

position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#ccc;
transition:.4s;
border-radius:30px;

}

.slider:before{

content:"";
position:absolute;
height:22px;
width:22px;
left:3px;
bottom:3px;
background:white;
transition:.4s;
border-radius:50%;

}

input:checked + .slider{

background:#1976D2;

}

input:checked + .slider:before{

transform:translateX(26px);

}

.footer{

margin-top:25px;
text-align:center;
color:#777;
font-size:14px;

}

</style>

</head>

<body>

<div class="container">

<h1>Settings</h1>

<p class="subtitle">

Manage your MultyTime preferences

</p>

<div class="item">

<span class="label">

Auto Login

</span>

<label class="switch">

<input type="checkbox">

<span class="slider"></span>

</label>

</div>

<div class="item">

<span class="label">

About

</span>

<a href="/about" class="setting-link">

View

</a>

</div>

<div class="item">

<span class="label">

Version

</span>

<a href="/version" class="setting-link">

Details

</a>

</div>

<div class="footer">

© 2026 MultyTime

</div>

</div>

</body>

</html>
